<p class="sub">Konular depo gibidir, öneriler birer değişiklik teklifidir. Oylamayla kabul edilen karar deftere eklenir; hiçbir şey silinmez, yalnızca gizlenir.</p>

<noscript><p style="padding:16px">Bu uygulama JavaScript gerektirir.</p></noscript>
<script>
'use strict';
/* =====================================================================
   KARAR DEPOSU: katmanlı mimari
   1 Konfig  2 Yardımcılar  3 Altyapı (Hash, Depolama, Repository, Store)
   4 Alan modeli (Factory/Builder/State/Registry)  5 Alan servisleri
   6 YZ katmanı (Gateway, Guardrails, Voter)  7 Uygulama cephesi (Facade)
   8 Sunum (Renderer)  9 Denetleyici (Mediator/Command)  10 Composition Root
   Desen haritası "Mimari" sekmesinde de listelenir.
   ===================================================================== */

/* ===== 1. KONFİG: sihirli sayı yok ===== */
const CONFIG = Object.freeze({
  STORAGE_KEY: 'kd3', SCHEMA_VERSION: 3, AI_USER_ID: 'u5',
  WEEKLY_CREDITS: 100, MAX_INTENSITY: 10, MAX_DELEGATED: 10,
  SUPPORT_NEEDED: 2, REVIEW_DAYS: 90, SUPER_MAJORITY: 2 / 3,
  SIMILARITY: 0.5, PASSWORD_ROUNDS: 1000, PASSWORD_MIN: 6, REASON_MIN: 3, EDIT_MIN: 5,
  DEFAULT_SCOPES: Object.freeze({ sınıf: 0.3, üni: 0.5, herkes: 0.6 }),
  STATUS: Object.freeze({ DRAFT: 'taslak', OPEN: 'açık', CLOSED: 'kapalı', HIDDEN: 'gizli' }),
  PSTATUS: Object.freeze({ PENDING: 'bekliyor', ACCEPTED: 'kabul', REJECTED: 'red' }),
  AI: Object.freeze({ timeoutMs: 4000, retries: 1, breakerThreshold: 3, breakerCooldownMs: 30000 }),
  PALETTE: Object.freeze(['#2a6f97', '#2f855a', '#b7791f', '#8e44ad', '#c0392b', '#16a085']),
});
const ST = CONFIG.STATUS, PS = CONFIG.PSTATUS;
const apiBase = ua => /KararDeposuApp/.test(ua) ? 'http://10.0.2.2:8000' : 'http://localhost:8000';

/* ===== 2. YARDIMCILAR ===== */
const Util = {
  // Tek tırnak da kaçırılır: öznitelik içine güvenle yazılabilir (XSS)
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  uid: () => Array.from(crypto.getRandomValues(new Uint32Array(2)), n => n.toString(36)).join('').slice(0, 8),
  clamp: (n, lo, hi) => Math.max(lo, Math.min(hi, n)),
  // Jaccard benzerliği; \W yerine Unicode harf sınıfı (ç, ş, ğ, ı kelimeyi bölmesin)
  words: s => new Set(String(s).toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean)),
  similarity(a, b) {
    const x = Util.words(a), y = Util.words(b), union = new Set([...x, ...y]);
    return union.size ? [...x].filter(w => y.has(w)).length / union.size : 0;
  },
};
const esc = Util.esc;
const ok = (extra = {}) => ({ ok: true, ...extra });
const fail = (error, extra = {}) => ({ ok: false, error, ...extra });
const Validate = {
  required: (label, v) => String(v ?? '').trim() ? null : `${label} zorunlu.`,
  minLen: (label, v, n) => String(v ?? '').trim().length >= n ? null : `${label} en az ${n} karakter olmalı.`,
  notFuture: (label, v) => v && new Date(v) > new Date() ? `${label} gelecekte olamaz.` : null,
  first: (...errs) => errs.find(Boolean) || null,
};
const SystemClock = {
  stamp: () => new Date().toISOString().slice(0, 16).replace('T', ' '),
  epochWeek: () => Math.floor(Date.now() / (7 * 864e5)),
  addDays: n => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10),
};

/* ===== 3. ALTYAPI ===== */
// Hasher sözleşmesi: { hash(string) } (ISP: tek ve dar arayüz)
class Sha256Hasher {
  constructor() {
    const primes = []; for (let n = 2; primes.length < 64; n++) if (primes.every(p => n % p)) primes.push(n);
    this.K = primes.map(p => Math.floor((Math.cbrt(p) % 1) * 2 ** 32));
    this.H0 = primes.slice(0, 8).map(p => Math.floor((Math.sqrt(p) % 1) * 2 ** 32));
  }
  hash(msg) {
    const bytes = new TextEncoder().encode(msg), len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(total); buf.set(bytes); buf[len] = 0x80;
    const dv = new DataView(buf.buffer); dv.setUint32(total - 8, Math.floor(len * 8 / 2 ** 32)); dv.setUint32(total - 4, (len * 8) >>> 0);
    const h = this.H0.slice(), w = new Uint32Array(64), K = this.K, rr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < total; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      let [a, b, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const t1 = (hh + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      [a, b, c, d, e, f, g, hh].forEach((v, i) => { h[i] = (h[i] + v) | 0; });
    }
    return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
  }
}
// Tuzlu + yinelemeli özet. Not: istemci tarafı özet gerçek güvenlik değildir; üretimde sunucuda Argon2/bcrypt gerekir.
class PasswordHasher {
  constructor(hasher, rounds) { this.hasher = hasher; this.rounds = rounds; }
  derive(pw, salt) { let h = salt + pw; for (let i = 0; i < this.rounds; i++) h = this.hasher.hash(h + salt); return h; }
  make(pw) { const salt = Util.uid() + Util.uid(); return { salt, hash: this.derive(pw, salt) }; }
  verify(pw, rec) { return !!rec && this.derive(pw, rec.salt) === rec.hash; }
}
// Zincirli defter (olay günlüğü): yalnızca ekleme, her kayıt öncekinin özetini taşır
class Ledger {
  constructor(hasher, clock) { this.hasher = hasher; this.clock = clock; }
  digest(prev, type, msg, t) { return this.hasher.hash([prev, type, msg, t].join('|')); }
  append(chain, type, msg) {
    const prev = chain.length ? chain[chain.length - 1].hash : '0', t = this.clock.stamp();
    chain.push({ i: chain.length, t, type, msg, prev, hash: this.digest(prev, type, msg, t) });
  }
  verify(chain) { return chain.every((e, i) => e.i === i && e.prev === (i ? chain[i - 1].hash : '0') && e.hash === this.digest(e.prev, e.type, e.msg, e.t)); }
}
// Depolama sözleşmesi: { get(k), set(k,v) }. Adapter + Null Object (MemoryStorage)
class LocalStorageAdapter {
  get(k) { try { return localStorage.getItem(k); } catch (e) { console.warn('Depolama okunamadı', e); return null; } }
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { console.warn('Depolama yazılamadı', e); return false; } }
}
class MemoryStorage { constructor() { this.m = new Map(); } get(k) { return this.m.get(k) ?? null; } set(k, v) { this.m.set(k, v); return true; } }
const pickStorage = () => { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return new LocalStorageAdapter(); } catch (e) { return new MemoryStorage(); } };

class StateRepository {
  constructor(storage, key, version, seeder) { Object.assign(this, { storage, key, version, seeder }); }
  static valid(s, v) { return !!s && s.v === v && ['users', 'topics', 'domains', 'ledger'].every(k => Array.isArray(s[k])) && !!s.scopes; }
  load() {
    const raw = this.storage.get(this.key);
    if (raw) { try { const s = JSON.parse(raw); if (StateRepository.valid(s, this.version)) return s; } catch (e) { console.warn('Bozuk kayıt, yeniden başlatılıyor', e); } }
    return this.seed();
  }
  seed() { const s = this.seeder(); this.save(s); return s; }
  save(s) { this.storage.set(this.key, JSON.stringify(s)); }
}
// Observer + Memento (işlem hatasında geri alma) + Prototype (structuredClone)
class Store {
  constructor(repo) { this.repo = repo; this.state = repo.load(); this.subs = new Set(); }
  subscribe(fn) { this.subs.add(fn); return () => this.subs.delete(fn); }
  commit(mutator) {
    const snapshot = structuredClone(this.state);
    try { mutator(this.state); } catch (e) { this.state = snapshot; console.error('İşlem geri alındı', e); throw e; }
    this.repo.save(this.state); this.subs.forEach(fn => fn(this.state));
  }
  reset() { this.state = this.repo.seed(); this.subs.forEach(fn => fn(this.state)); }
}

/* ===== 4. ALAN MODELİ ===== */
const Domains = {   // Composite: alan ağacı
  names: ds => ds.map(d => d.n),
  has: (ds, n) => ds.some(d => d.n === n),
  ancestors(ds, n) {
    const out = [], seen = new Set(); let x = ds.find(d => d.n === n);
    while (x && !seen.has(x.n)) { seen.add(x.n); out.push(x.n); x = x.p && ds.find(d => d.n === x.p); }
    return out;
  },
};
// State: konu yaşam döngüsü, geçersiz geçişe izin vermez
const TopicLifecycle = {
  next: { [ST.DRAFT]: [ST.OPEN], [ST.OPEN]: [ST.CLOSED, ST.HIDDEN], [ST.CLOSED]: [ST.HIDDEN], [ST.HIDDEN]: [] },
  can: (from, to) => (TopicLifecycle.next[from] || []).includes(to),
  transition(t, to) { if (!TopicLifecycle.can(t.status, to)) throw new Error(`"${t.status}" durumundan "${to}" durumuna geçilemez`); t.status = to; },
};
// Open/Closed: yeni öneri türü = bu kayda yeni satır (başka kod değişmez)
const ProposalTypes = Object.freeze({
  edit:   { label: 'Düzenleme', formTitle: 'Düzenleme önerisi', textLabel: 'Yeni karar metni', minLength: CONFIG.EDIT_MIN, aiReview: true, apply: (t, p) => { t.text = p.payload; } },
  delete: { label: 'Silme', formTitle: 'Silme (gizleme) önerisi', textLabel: 'Gerekçe', minLength: CONFIG.REASON_MIN, aiReview: false, apply: t => TopicLifecycle.transition(t, ST.HIDDEN) },
  close:  { label: 'Kapatma', formTitle: 'Kapatma önerisi', textLabel: 'Gerekçe', minLength: CONFIG.REASON_MIN, aiReview: false, apply: t => TopicLifecycle.transition(t, ST.CLOSED) },
});
// Factory
const UserFactory = {
  create({ id, name, surname, nick, interests = [], ai = false, birth = '', address = '', credential = null }) {
    return { id: id || 'u' + Util.uid(), name, surname, nick, interests: [...interests], del: {}, allAI: false, ai, birth, address, pw: credential, cr: null };
  },
};
const ProposalFactory = {
  create(type, { id, by, payload, constitutional = false }) {
    if (!ProposalTypes[type]) throw new Error('Bilinmeyen öneri türü: ' + type);
    return { id: id || 'p' + Util.uid(), type, by, payload, anayasal: !!constitutional, votes: {}, status: PS.PENDING };
  },
};
// Builder
class TopicBuilder {
  constructor() { this.t = { id: 't' + Util.uid(), parent: null, status: ST.DRAFT, props: [], cm: [], support: [] }; }
  id(v) { this.t.id = v; return this; } title(v) { this.t.title = v; return this; } text(v) { this.t.text = v; return this; }
  domain(v) { this.t.domain = v; return this; } scope(v) { this.t.scope = v; return this; }
  parent(v) { this.t.parent = v || null; return this; } status(v) { this.t.status = v; return this; }
  supporters(ids) { this.t.support = [...ids]; return this; }
  build() { for (const k of ['title', 'text', 'domain', 'scope']) if (!this.t[k]) throw new Error('Konu için eksik alan: ' + k); return this.t; }
}

/* ===== 5. ALAN SERVİSLERİ ===== */
// Strategy: çoğunluk ve yeter sayı politikaları (LSP: birbirinin yerine geçer)
class SimpleMajority { get name() { return 'basit çoğunluk'; } passes(y, n) { return y > n; } }
class SuperMajority { get name() { return '2/3 eşiği'; } passes(y, n) { return y + n > 0 && y / (y + n) >= CONFIG.SUPER_MAJORITY; } }
class ScopeQuorum { required(state, topic, total) { return (state.scopes[topic.scope] ?? 1) * total; } }

class DelegationService {   // kim oy kullanır, kimin ağırlığı kaç
  analyze(state, topic) {
    const A = Domains.ancestors(state.domains, topic.domain), byId = new Map(state.users.map(u => [u.id, u]));
    const eligible = state.users.filter(u => topic.scope === 'herkes' || u.ai || u.interests.some(i => A.includes(i)));
    const ids = new Set(eligible.map(u => u.id));
    const raw = u => A.map(d => u.del[d]).find(Boolean) || (u.allAI ? CONFIG.AI_USER_ID : null);
    // Zincir yok: devralan kişinin kendisi devretmişse devir geçersiz (döngü ve güç yığılması engellenir)
    const delegateOf = u => { const d = raw(u), target = d && byId.get(d); return target && ids.has(d) && d !== u.id && !raw(target) ? d : null; };
    const counts = {}; eligible.forEach(u => { const d = delegateOf(u); if (d) counts[d] = (counts[d] || 0) + 1; });
    const weights = {}; eligible.forEach(u => { if (!delegateOf(u)) weights[u.id] = 1 + Math.min(CONFIG.MAX_DELEGATED, counts[u.id] || 0); });
    return { weights, delegateOf, eligible, total: Object.values(weights).reduce((a, b) => a + b, 0) };
  }
}
class VotingEngine {   // CQRS-lite: sayım okuma modelidir, saklanmaz, her seferinde türetilir
  constructor(delegation, quorum, simple, constitutional) { Object.assign(this, { delegation, quorum, simple, constitutional }); }
  tally(state, p, t, an = this.delegation.analyze(state, t)) {
    let yes = 0, no = 0, base = 0;
    for (const [id, v] of Object.entries(p.votes)) {
      const w = an.weights[id]; if (!w) continue;
      const eff = w + ((v.n || 1) - 1); base += w; v.v ? yes += eff : no += eff;
    }
    return { total: an.total, yes, no, cast: yes + no, base, quorum: this.quorum.required(state, t, an.total) };
  }
  policyFor(p) { return p.anayasal ? this.constitutional : this.simple; }
}
class CreditService {   // karesel oylama: n oy = n²−1 puan
  constructor(clock) { this.clock = clock; }
  left(u) { if (u.ai) return 0; const w = this.clock.epochWeek(); if (!u.cr || u.cr.w !== w) u.cr = { w, left: CONFIG.WEEKLY_CREDITS }; return u.cr.left; }
  cost(n) { return n * n - 1; }
  maxIntensity(left) { return Math.min(CONFIG.MAX_INTENSITY, Math.floor(Math.sqrt(left + 1))); }
  spend(u, n) { const c = this.cost(n); if (c > this.left(u)) return false; u.cr.left -= c; return true; }
}
class ResolutionService {   // Template Method: sayım → yeter sayı → karar → uygulama → rapor → defter
  constructor(engine, delegation, ledger, clock) { Object.assign(this, { engine, delegation, ledger, clock }); }
  resolve(state, p, t) {
    const an = this.delegation.analyze(state, t), k = this.engine.tally(state, p, t, an);
    if (k.base < k.quorum || !k.cast) return false;
    const policy = this.engine.policyFor(p);
    let accepted = policy.passes(k.yes, k.no), note = '';
    if (accepted) { try { ProposalTypes[p.type].apply(t, p); } catch (e) { accepted = false; note = ` Uygulanamadı: ${e.message}.`; } }
    p.status = accepted ? PS.ACCEPTED : PS.REJECTED; p.at = this.clock.stamp(); p.exp = this.clock.addDays(CONFIG.REVIEW_DAYS);
    p.minority = this.report(state, p, k, accepted, policy, an) + note;
    this.ledger.append(state.ledger, accepted ? 'KABUL' : 'RED', `${t.title}: ${p.type} önerisi ${accepted ? 'kabul edildi' : 'reddedildi'} (${k.yes}-${k.no})`);
    return true;
  }
  report(state, p, k, accepted, policy, an) {
    const losers = Object.entries(p.votes).filter(([id, v]) => v.v !== accepted && an.weights[id])
      .map(([id, v]) => `${v.pub ? (state.users.find(u => u.id === id)?.nick ?? id) : 'Anonim'}${v.n > 1 ? ' (×' + v.n + ' şiddet)' : ''}: ${v.r || 'gerekçe yok'}`);
    return `Kaybeden taraf (${accepted ? k.no : k.yes} ağırlık): ${losers.join(' | ') || '—'}. Otomatik kontrol (şablon): katılım ${k.base}/${k.total} (oy şiddeti yeter sayıya sayılmaz, yalnızca sonuca); ${policy.name} uygulandı; oy kullanmayan ${k.total - k.base} ağırlık kararı etkilemedi; karar ${p.exp} tarihinde yeniden oylanacak.`;
  }
}

/* ===== 6. YZ KATMANI ===== */
// Adapter (HTTP ↔ uygulama) + Proxy (devre kesici) + Retry + Timeout
class AIGateway {
  constructor({ base, fetchFn = (...a) => fetch(...a), timeoutMs, retries, threshold, cooldownMs, now = () => Date.now() }) {
    Object.assign(this, { base, fetchFn, timeoutMs, retries, threshold, cooldownMs, now }); this.fails = 0; this.openedAt = 0;
  }
  get isOpen() { return this.openedAt > 0 && this.now() - this.openedAt < this.cooldownMs; }
  async post(path, body) {
    if (this.isOpen) throw new Error('YZ sunucusu geçici olarak devre dışı (devre kesici açık)');
    if (this.openedAt) { this.openedAt = 0; this.fails = this.threshold - 1; }   // yarı açık: tek deneme hakkı
    let last;
    for (let i = 0; i <= this.retries; i++) {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), this.timeoutMs);
      try {
        const r = await this.fetchFn(this.base + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const json = await r.json(); this.fails = 0; return json;
      } catch (e) { last = e; } finally { clearTimeout(timer); }
    }
    if (++this.fails >= this.threshold) this.openedAt = this.now();
    throw last;
  }
}
// Guardrails: YZ çıktısı güvenilmezdir; şema doğrulanır, uzunluk sınırlanır, yalnızca boolean/metin kabul edilir, asla çalıştırılmaz
const AIGuards = {
  regulation: r => r && typeof r.ok === 'boolean' ? { ok: r.ok, rule: String(r.rule ?? '?').slice(0, 20), reason: String(r.reason ?? '').slice(0, 300) } : null,
  vote: r => r && typeof r.vote === 'boolean' ? { vote: r.vote, reason: String(r.reason ?? 'gerekçe yok').slice(0, 500) } : null,
};
// Chain of Responsibility: kural sözleşmesi { appliesTo(ctx), check(ctx) → {ok,rule?,reason?,degraded?} }
const LOCAL_REGULATIONS = Object.freeze([
  { id: 'Y-1', pattern: /oy hakk[ıi]n[ıi]\s*(kald|sil)/i, reason: 'Oy hakkını kaldıran öneri kabul edilmez.' },
  { id: 'Y-2', pattern: /defter\w*\s*sil/i, reason: 'Defteri silmeyi hedefleyen öneri kabul edilmez.' },
  { id: 'Y-3', pattern: /kimli[gğ]\w*\s*if[sş]a/i, reason: 'Kimlik ifşası kabul edilmez.' },
  { id: 'Y-4', pattern: /azınlı[gğ]ı?\s*(sustur|yasakla)/i, reason: 'Azınlığı susturmayı hedefleyen öneri kabul edilmez.' },
]);
class LocalRegulationRule {
  constructor(rules) { this.rules = rules; }
  appliesTo() { return true; }
  async check({ title = '', text = '' }) { const s = title + ' ' + text, hit = this.rules.find(r => r.pattern.test(s)); return hit ? { ok: false, rule: hit.id, reason: hit.reason } : { ok: true }; }
}
class RemoteRegulationRule {
  constructor(gateway) { this.gateway = gateway; }
  appliesTo(ctx) { return ctx.kind === 'topic' || !!ProposalTypes[ctx.kind]?.aiReview; }
  async check({ title, text }) {
    try {
      const v = AIGuards.regulation(await this.gateway.post('/ai/regulation', { title, text }));
      if (!v) throw new Error('geçersiz yanıt şeması');
      return v.ok ? { ok: true } : { ok: false, rule: v.rule, reason: v.reason };
    } catch (e) { console.warn('YZ denetimi atlandı:', e.message); return { ok: true, degraded: true }; }   // bilinçli "fail-open"; yerel kurallar yine de çalıştı
  }
}
class RegulationChain {
  constructor(rules) { this.rules = rules; }
  async check(ctx) {
    let degraded = false;
    for (const r of this.rules) { if (!r.appliesTo(ctx)) continue; const res = await r.check(ctx); degraded ||= !!res.degraded; if (!res.ok) return res; }
    return { ok: true, degraded };
  }
}
// Strategy + Decorator: oy verici sözleşmesi { vote(ctx) → {vote,reason,source} }
class RemoteAIVoter {
  constructor(gateway) { this.gateway = gateway; }
  async vote({ topic, proposal }) {
    // topic.text kullanıcı girdisidir (güvensiz): sunucu bunu talimat değil veri olarak ele almalı
    const v = AIGuards.vote(await this.gateway.post('/ai/vote', { topic_title: topic.title, topic_text: topic.text, domain: topic.domain, proposal_type: proposal.type, payload: proposal.payload, constitutional: proposal.anayasal }));
    if (!v) throw new Error('geçersiz yanıt şeması');
    return { ...v, source: 'ai' };
  }
}
class RuleBasedVoter {
  async vote({ proposal }) { return { vote: !(proposal.anayasal || proposal.type === 'delete'), reason: 'Sunucuya ulaşılamadı, kural tabanlı yedek kullanıldı', source: 'yedek' }; }
}
class FallbackVoter {   // zarif bozulma
  constructor(primary, fallback) { this.primary = primary; this.fallback = fallback; }
  async vote(ctx) { try { return await this.primary.vote(ctx); } catch (e) { console.warn('YZ oyu başarısız, yedek devrede:', e.message); return this.fallback.vote(ctx); } }
}

/* ===== 7. UYGULAMA CEPHESİ (Facade): arayüz yalnızca bunu çağırır ===== */
class App {
  constructor(d) { Object.assign(this, d); }   // bağımlılık enjeksiyonu (DIP)
  get state() { return this.store.state; }
  user(id) { return this.state.users.find(u => u.id === id); }
  topic(id) { return this.state.topics.find(t => t.id === id); }
  me() { return this.user(this.state.me); }
  tree() { return Domains.names(this.state.domains); }
  log(type, msg) { this.ledger.append(this.state.ledger, type, msg); }
  resolve(p, t) { return this.resolution.resolve(this.state, p, t); }

  login(nick, pw) {
    const u = this.state.users.find(x => x.nick === nick && !x.ai && x.pw);
    if (!u || !this.passwords.verify(pw, u.pw)) return fail('Takma ad veya şifre yanlış.');
    this.store.commit(s => { s.me = u.id; }); return ok();
  }
  logout() { this.store.commit(s => { s.me = null; }); }
  register(f) {
    const err = Validate.first(...[['Ad', f.name], ['Soyad', f.surname], ['Doğum tarihi', f.birth], ['Adres', f.address], ['Takma ad', f.nick], ['Şifre', f.pw]].map(([l, v]) => Validate.required(l, v)),
      Validate.notFuture('Doğum tarihi', f.birth), Validate.minLen('Şifre', f.pw, CONFIG.PASSWORD_MIN));
    if (err) return fail(err);
    if (this.state.users.some(u => u.nick === f.nick.trim())) return fail('Bu takma ad alınmış.');
    const user = UserFactory.create({ name: f.name.trim(), surname: f.surname.trim(), nick: f.nick.trim(), birth: f.birth, address: f.address.trim(), interests: f.interests, credential: this.passwords.make(f.pw) });
    this.store.commit(s => { s.users.push(user); s.me = user.id; this.log('KULLANICI', user.nick + ' katıldı'); });
    return ok();
  }
  async openTopic(f) {
    const title = f.title.trim(), text = f.text.trim(), me = this.me();
    const err = Validate.first(Validate.required('Başlık', title), Validate.required('Metin', text));
    if (!me) return fail('Önce giriş yap.'); if (err) return fail(err);
    const dup = this.state.topics.find(t => t.status !== ST.HIDDEN && Util.similarity(t.title, title) > CONFIG.SIMILARITY);
    if (dup && !f.confirmedDup) return fail(`Benzer konu var: "${dup.title}". Yine de açmak için tekrar bas (birleştirme önerilir).`, { needsConfirm: true });
    const chk = await this.regulation.check({ kind: 'topic', title, text });
    if (!chk.ok) return fail(`Yönetmeliğe aykırı (madde ${chk.rule || '?'}): ${chk.reason}`);
    const newDomain = f.newDomain.trim().toLowerCase(), newScope = f.newScope.trim().toLowerCase();
    this.store.commit(s => {
      let domain = f.domain, scope = f.scope;
      if (newDomain) {
        if (!Domains.has(s.domains, newDomain)) { s.domains.push({ n: newDomain, p: f.newDomainParent || null }); this.user(me.id).interests.push(newDomain); this.log('ALAN', newDomain + ' alanı eklendi' + (f.newDomainParent ? ` (${f.newDomainParent} alt dalı)` : '')); }
        domain = newDomain;
      }
      if (newScope) {
        if (!s.scopes[newScope]) { s.scopes[newScope] = Util.clamp((+f.newScopeQuorum || 50) / 100, 0.05, 1); this.log('ETKİ', newScope + ' etki alanı eklendi'); }
        scope = newScope;
      }
      s.topics.push(new TopicBuilder().title(title).text(text).domain(domain).scope(scope).parent(f.parent).supporters([me.id]).build());
      this.log('KONU', title + ' taslak olarak açıldı');
    });
    return ok({ degraded: chk.degraded });
  }
  support(tid) {
    const t = this.topic(tid), me = this.me();
    if (!t || !me || t.status !== ST.DRAFT || t.support.includes(me.id)) return fail('Bu konuya destek verilemez.');
    this.store.commit(() => { t.support.push(me.id); if (t.support.length >= CONFIG.SUPPORT_NEEDED) { TopicLifecycle.transition(t, ST.OPEN); this.log('KONU', t.title + ' yeterli destekle yayınlandı'); } });
    return ok();
  }
  async propose(kind, tid, text, constitutional) {
    const t = this.topic(tid), me = this.me(), type = ProposalTypes[kind], body = (text || '').trim();
    if (!t || !me || !type) return fail('Öneri oluşturulamadı.'); if (t.status !== ST.OPEN) return fail('Yalnızca açık konulara öneri yapılır.');
    const err = Validate.minLen(type.textLabel, body, type.minLength); if (err) return fail(err);
    const chk = await this.regulation.check({ kind, title: t.title, text: body });
    if (!chk.ok) return fail(`Yönetmeliğe aykırı (madde ${chk.rule || '?'}): ${chk.reason}`);
    this.store.commit(() => { t.props.push(ProposalFactory.create(kind, { by: me.id, payload: body, constitutional })); this.log('ÖNERİ', `${t.title}: ${kind} önerildi`); });
    return ok({ degraded: chk.degraded });
  }
  vote(pid, tid, yes, { intensity = 1, reason = '', pub = true } = {}) {
    const t = this.topic(tid), me = this.me(), p = t?.props.find(x => x.id === pid);
    if (!me || !t || !p) return fail('Oturum, konu veya öneri bulunamadı.');
    if (t.status !== ST.OPEN || p.status !== PS.PENDING) return fail('Bu öneri artık oylanamaz.');
    if (p.votes[me.id]) return fail('Bu öneriye zaten oy verdin.');   // idempotency
    if (!this.delegation.analyze(this.state, t).weights[me.id]) return fail('Bu konuda oy hakkın yok.');
    const n = Util.clamp(Math.round(+intensity) || 1, 1, this.credits.maxIntensity(this.credits.left(me)));
    this.store.commit(() => {
      if (!this.credits.spend(me, n)) throw new Error('Yetersiz karar puanı');
      p.votes[me.id] = { v: !!yes, r: reason, pub: !!pub, n };
      this.log('OY', `${pub ? me.nick : 'Anonim'} oy verdi (${pid})${n > 1 ? ` ×${n} şiddet, ${this.credits.cost(n)} puan` : ''}`);
      this.resolve(p, t);
    });
    return ok();
  }
  delegate(domain, toId) {
    const me = this.me(); if (!me || !Domains.has(this.state.domains, domain)) return fail('Alan bulunamadı.');
    const to = toId && this.user(toId);
    if (toId && (!to || to.id === me.id)) return fail('Geçersiz delegasyon hedefi.');
    this.store.commit(() => { if (to) me.del[domain] = to.id; else delete me.del[domain]; this.log('DELEGASYON', `${me.nick} → ${to ? to.nick : '(geri aldı)'} [${domain}]`); });
    return ok();
  }
  toggleAllAI() { const me = this.me(); this.store.commit(() => { me.allAI = !me.allAI; this.log('DELEGASYON', `${me.nick} → Claude (her konu ${me.allAI ? 'açık' : 'kapalı'})`); }); }
  addComment(tid, text, pub) {
    const t = this.topic(tid), me = this.me(), x = (text || '').trim(); if (!t || !me || !x) return fail('Yorum boş olamaz.');
    this.store.commit(() => { t.cm.push({ by: me.id, x, pub: !!pub, t: this.clock.stamp() }); this.log('YORUM', t.title + ': yeni yorum'); }); return ok();
  }
  async aiVoteAll() {
    let n = 0;
    for (const t of [...this.state.topics]) for (const p of [...t.props]) {
      const open = () => t.status === ST.OPEN && p.status === PS.PENDING && !p.votes[CONFIG.AI_USER_ID];   // tekrar çalıştırmak güvenli
      if (!open() || !this.delegation.analyze(this.state, t).weights[CONFIG.AI_USER_ID]) continue;
      const r = await this.voter.vote({ topic: t, proposal: p });
      if (!open()) continue;   // beklerken durum değişmiş olabilir
      this.store.commit(() => { p.votes[CONFIG.AI_USER_ID] = { v: r.vote, r: r.reason, pub: true, n: 1, src: r.source }; this.log('OY', `claude-ai oy verdi (${p.id})`); this.resolve(p, t); });
      n++;
    }
    return n;
  }
  verifyLedger() { return this.ledger.verify(this.state.ledger); }   // veri kalitesi denetimi
  resetDemo() { this.store.reset(); }
}

  }
  proposal(t, p, an, me) {
    const a = this.app, k = a.engine.tally(a.state, p, t, an), den = Math.max(k.total, k.cast), yp = den ? k.yes / den * 100 : 0, np = den ? k.no / den * 100 : 0;
    const left = a.credits.left(me), mx = a.credits.maxIntensity(left), mine = an.weights[me.id], d = an.delegateOf(me), id = esc(p.id), tid = esc(t.id);
    let act;
    if (p.votes[me.id]) act = '<div>Oyun kayıtlı.</div>';
    else if (mine) act = `<input id="r${id}" placeholder="Gerekçe (karşı oyda azınlık raporuna girer)" aria-label="Gerekçe"><label><input type="checkbox" id="pv${id}" checked style="width:auto"> Oyum adımla görünsün (kapatırsan anonim)</label><label for="n${id}">Oy şiddeti: <b id="nv${id}">1</b> oy · maliyet <b id="nc${id}">0</b> puan (kalan ${left}/${CONFIG.WEEKLY_CREDITS})</label><input type="range" id="n${id}" data-range="${id}" min="1" max="${mx}" value="1"><div class="row"><button class="b y" data-action="vote" data-yes="1" data-pid="${id}" data-tid="${tid}">Evet (ağırlık ${mine})</button><button class="b n" data-action="vote" data-yes="0" data-pid="${id}" data-tid="${tid}">Hayır</button></div>`;
    else if (d) act = `<div>Oyunu ${esc(a.user(d)?.nick)} kullanıyor (devredildi).</div>`;
    else act = '<div class="err">Bu konuda oy hakkın yok (ilgi alanın değil).</div>';
    return `<div class="c flat"><b>${esc(ProposalTypes[p.type]?.label ?? p.type)}</b> önerisi — ${esc(a.user(p.by)?.nick)} ${p.anayasal ? this.chip('2/3 gerekli', 'pen') : ''}<div>${esc(p.payload)}</div><div class="tl"><i style="width:${yp}%;background:var(--yes)"></i><i style="width:${np}%;background:var(--no)"></i></div><div class="sub">Evet ${k.yes} · Hayır ${k.no} · Katılım ${k.base}/${k.total} (yeter sayı ${k.quorum.toFixed(1)})</div><div class="sub">Oylar: ${this.votesLine(p, me)}</div>${act}</div>`;
  }
  comments(t, me) {
    const c = t.cm || [], tid = esc(t.id);
    return `<details ${c.length ? 'open' : ''}><summary>Yorumlar (${c.length})</summary>${c.map(m => `<div class="mr"><b>${m.pub || m.by === me.id ? esc(this.app.user(m.by)?.nick) : 'Anonim'}</b>${m.by === me.id && !m.pub ? ' (sen, anonim)' : ''} <span class="sub">${esc(m.t)}</span><div>${esc(m.x)}</div></div>`).join('')}<input id="cm${tid}" placeholder="Yorumun" aria-label="Yorumun"><div class="row"><label style="margin:0"><input type="checkbox" id="cp${tid}" checked style="width:auto"> Adımla görünsün</label><button class="b" data-action="comment" data-tid="${tid}">Yorum yaz</button></div></details>`;
  }
  topic(t, depth, me) {
    const a = this.app; if (t.status === ST.HIDDEN && !this.vs.showHidden) return '';
    const an = a.delegation.analyze(a.state, t), kids = a.state.topics.filter(x => x.parent === t.id), tid = esc(t.id);
    let h = `<div class="c ${depth ? 'sub1' : ''}"><h3>${esc(t.title)}</h3><div class="row">${this.chip(Domains.ancestors(a.state.domains, t.domain).reverse().join(' › '))}${this.chip('etki: ' + t.scope)}${this.chip(t.status, t.status === ST.OPEN ? 'ok' : t.status === ST.DRAFT ? 'pen' : '')}</div><p>${esc(t.text)}</p>`;
    if (t.status === ST.DRAFT) h += `<div>Destek: ${t.support.length}/${CONFIG.SUPPORT_NEEDED} <button class="b" data-action="support" data-tid="${tid}" ${t.support.includes(me.id) ? 'disabled' : ''}>Destekle</button></div>`;
    else if (t.status === ST.OPEN) h += `<div class="row">${Object.entries(ProposalTypes).map(([k, ty]) => `<button class="b" data-action="open-form" data-kind="${esc(k)}" data-tid="${tid}">${esc(ty.label)} öner</button>`).join('')}<button class="b" data-action="open-form" data-kind="topic" data-tid="${tid}">Alt konu</button></div>`;
    if (t.status === ST.OPEN) t.props.filter(p => p.status === PS.PENDING).forEach(p => { h += this.proposal(t, p, an, me); });
    h += this.comments(t, me);
    const done = t.props.filter(p => p.status !== PS.PENDING);
    if (done.length) h += `<details><summary>Karar geçmişi (${done.length})</summary>${done.map(p => `<div class="c flat">${this.chip(p.status, p.status === PS.ACCEPTED ? 'ok' : '')} ${esc(p.type)} · ${esc(p.at)}${p.status === PS.ACCEPTED ? ' · sona erme ' + esc(p.exp) : ''}<div>${esc(p.payload)}</div><div class="mr"><b>Azınlık raporu:</b> ${esc(p.minority)}</div></div>`).join('')}</details>`;
    return h + '</div>' + kids.map(c => this.topic(c, 1, me)).join('');
  }
  graph(me) {
    const a = this.app, users = a.state.users, n = users.length, pos = {};
    users.forEach((u, i) => { const ang = i / n * 2 * Math.PI - Math.PI / 2; pos[u.id] = [170 + 150 * Math.cos(ang), 150 + 120 * Math.sin(ang)]; });
    let s = '<svg viewBox="0 0 340 300" style="width:100%;max-width:520px" role="img" aria-label="Delegasyon grafı"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="14" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="context-stroke"/></marker></defs>';
    users.forEach(u => Object.entries(u.del).concat(u.allAI ? [['tümü', CONFIG.AI_USER_ID]] : []).forEach(([d, to]) => { if (pos[to]) s += `<line x1="${pos[u.id][0]}" y1="${pos[u.id][1]}" x2="${pos[to][0]}" y2="${pos[to][1]}" stroke="${this.color(d)}" stroke-width="2" marker-end="url(#ar)"/>`; }));
    users.forEach(u => { const [x, y] = pos[u.id]; s += `<circle cx="${x}" cy="${y}" r="13" fill="${u.ai ? 'var(--acc)' : 'var(--card)'}" stroke="var(--ink)" stroke-width="${u.id === me.id ? 3 : 1}"/><text x="${x}" y="${y + 27}" text-anchor="middle" font-size="11" fill="var(--ink)">${esc(u.nick)}</text>`; });
    return s + '</svg>';
  }
  delegationTab(me) {
    const a = this.app, names = a.tree();
    const rows = names.map(d => {
      const anc = Domains.ancestors(a.state.domains, d), opts = a.state.users.filter(u => u.id !== me.id && (u.ai || u.interests.some(i => anc.includes(i)))), inc = a.state.users.filter(u => u.del[d] === me.id).length;
      return `<div class="row"><b style="min-width:80px">${esc(d)}</b><select style="width:auto" data-change="delegate" data-domain="${esc(d)}" aria-label="${esc(d)} için delege"><option value="">Kendim oy veririm</option>${opts.map(u => `<option value="${esc(u.id)}" ${me.del[d] === u.id ? 'selected' : ''}>${esc(u.nick)}</option>`).join('')}</select>${inc ? this.chip('sana devreden: ' + inc) : ''}</div>`;
    }).join('');
    return `<div class="c"><h3>Kim kime oy devretti?</h3>${this.graph(me)}<div class="row">${names.map(d => `<span><span style="color:${this.color(d)}">●</span> ${esc(d)}</span>`).join('')}<span>Mavi dolu düğüm: yapay zekâ</span></div></div><div class="c"><h3>${esc(me.nick)} için delegasyon</h3><p class="sub">Alan bazlı devret, istediğin an geri al. Bir kişi en fazla ${CONFIG.MAX_DELEGATED} oy toplayabilir. Üst alana devretmek alt dalları da kapsar. Claude her alanda devir alabilir.</p><div class="row"><button class="b p" data-action="all-ai">${me.allAI ? 'Claude devrini geri al' : "Her konuda Claude'a devret"}</button></div>${rows}</div>`;
  }
  ledgerTab() {
    return `<div class="bar"><button class="b" data-action="verify">Zinciri doğrula</button><span id="vr"></span></div>` + [...this.app.state.ledger].reverse().map(e => `<div class="c"><b>${esc(e.type)}</b> ${esc(e.msg)} <span class="sub">${esc(e.t)}</span><div class="mono">#${e.i} önceki ${esc(e.prev.slice(0, 10))} → hash ${esc(e.hash)}</div></div>`).join('');
  }
  rulesTab() {
    return `<div class="c"><h3>Değişmez kurallar</h3><ol><li>Hiçbir kayıt silinmez; "silme" yalnızca görünürlüğü kapatır.</li><li>Oy hakkını kaldıran, defteri silen veya kimlik ifşa eden öneriler yönetmelik kontrolünden geçemez.</li><li>Her değişiklik oylamayla yapılır; her karar defterde hash zinciriyle saklanır.</li><li>Temel haklara dokunan öneriler 2/3 ister.</li></ol></div><div class="c"><h3>Yönetmelik</h3><ul><li>Oylamaya yalnızca konunun alanıyla ilgilenenler katılır; etki alanı genişledikçe (sınıf → üni → herkes) yeter sayı artar (%30 / %50 / %60).</li><li>Oy ağırlığı 1 + devredilen oy, en fazla ${1 + CONFIG.MAX_DELEGATED}.</li><li>Karesel oylama: herkese haftada ${CONFIG.WEEKLY_CREDITS} karar puanı verilir. Bir konuda n oy vermek n²−1 puan tutar (ilk oy bedava). Tutkulu bir azınlık puanlarını tek konuda toplayıp ilgisiz bir çoğunluğa karşı ağırlık kazanabilir; puan sınırlı olduğu için herkes her konuda baskın olamaz. Yeter sayı (katılım) şiddetten etkilenmez.</li><li>Yeni konu ${CONFIG.SUPPORT_NEEDED} destekçi bulana kadar taslaktır; benzer başlık uyarısı verilir.</li><li>Her karar ${CONFIG.REVIEW_DAYS} gün sonra yeniden oylanır ve azınlık raporuyla saklanır.</li><li>Yapay zekâ grafta sınırlı ağırlıklı bir düğümdür; tüm devirleri görünür ve geri alınabilir.</li></ul></div><div class="c"><button class="b n" data-action="reset">Demo verisini sıfırla</button></div>`;
  }
  architectureTab() {
    const groups = [...new Set(PATTERNS.map(p => p[0]))];
    return `<div class="c"><h3>Mimari ve desen haritası</h3><p class="sub">Kod katmanlıdır: konfig → altyapı → alan modeli → alan servisleri → YZ katmanı → uygulama cephesi → sunum → denetleyici. Bağımlılıklar yalnızca aşağıdan yukarıya doğru akar.</p></div>` + groups.map(g => `<div class="c"><h3>${esc(g)}</h3><div class="scroll"><table class="pt"><thead><tr><th>Desen</th><th>Nerede</th><th>Ne kazandırır</th></tr></thead><tbody>${PATTERNS.filter(p => p[0] === g).map(p => `<tr><td><b>${esc(p[1])}</b></td><td>${esc(p[2])}</td><td>${esc(p[3])}</td></tr>`).join('')}</tbody></table></div></div>`).join('');
  }
  render() {
    const a = this.app, me = a.me(), vs = this.vs;
    document.querySelectorAll('nav button').forEach(b => { const on = b.dataset.tab === vs.tab; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    document.getElementById('auth').innerHTML = me ? `<b>${esc(me.nick)}</b> <span class="chip">karar puanı: ${a.credits.left(me)}/${CONFIG.WEEKLY_CREDITS}</span> <button class="b" data-action="logout">Çıkış</button>` : '';
    const main = document.getElementById('m');
    if (!me) { if (!vs.form || !['login', 'reg'].includes(vs.form.k)) vs.form = { k: 'login' }; main.innerHTML = this.form() + (vs.form.k === 'login' ? '<button class="b" data-action="open-form" data-kind="reg">Hesabın yok mu? Kayıt ol</button>' : ''); return; }
    let h = this.form();
    if (vs.tab === 'k') h += `<div class="bar"><button class="b p" data-action="open-form" data-kind="topic">Yeni konu aç</button><button class="b" id="aib" data-action="ai-vote">Claude oyunu işle</button><label style="margin:0"><input type="checkbox" style="width:auto" data-change="toggle-hidden" ${vs.showHidden ? 'checked' : ''}> Gizlenenleri göster</label></div>` + a.state.topics.filter(t => !t.parent).map(t => this.topic(t, 0, me)).join('');
    if (vs.tab === 'd') h += this.delegationTab(me);
    if (vs.tab === 'l') h += this.ledgerTab();
    if (vs.tab === 'r') h += this.rulesTab();
    if (vs.tab === 'm') h += this.architectureTab();
    main.innerHTML = h;
  }
}

/* ===== 9. DENETLEYİCİ: Mediator + Command kaydı (olay delegasyonu, satır içi onclick yok) ===== */
class Controller {
  constructor(app, vs, renderer) {
    this.app = app; this.vs = vs; this.renderer = renderer;
    this.handlers = {
      'tab': d => { this.vs.tab = d.tab; this.render(); },
      'open-form': d => { this.vs.form = { k: d.kind, tid: d.tid || null }; this.render(); },
      'form-cancel': () => { this.vs.form = null; this.render(); },
      'submit': () => this.submit(),
      'logout': () => { this.vs.form = null; this.app.logout(); },
      'support': d => this.report(this.app.support(d.tid)),
      'vote': d => this.report(this.app.vote(d.pid, d.tid, d.yes === '1', { intensity: this.val('n' + d.pid) || 1, reason: this.val('r' + d.pid), pub: this.checked('pv' + d.pid) })),
      'delegate': (d, el) => this.report(this.app.delegate(d.domain, el.value)),
      'all-ai': () => this.app.toggleAllAI(),
      'comment': d => this.report(this.app.addComment(d.tid, this.val('cm' + d.tid), this.checked('cp' + d.tid))),
      'ai-vote': async (d, el) => { el.disabled = true; el.textContent = 'Claude düşünüyor…'; try { const n = await this.app.aiVoteAll(); this.say(n ? `Claude ${n} öneriye oy verdi.` : 'Claude\'un oylayacağı öneri yok.'); } finally { this.render(); } },
      'verify': () => { document.getElementById('vr').textContent = this.app.verifyLedger() ? 'Zincir sağlam ✓' : 'Zincir bozuk!'; },
      'reset': () => { if (confirm('Demo verisi sıfırlansın mı? Tüm kayıtlar silinir.')) this.app.resetDemo(); },
      'toggle-hidden': (d, el) => { this.vs.showHidden = el.checked; this.render(); },
    };
  }
  render() { this.renderer.render(); }
  val(id) { return (document.getElementById(id) || {}).value || ''; }
  checked(id) { return !!(document.getElementById(id) || {}).checked; }
  say(msg, bad = false) { const s = document.getElementById('status'); s.textContent = msg; s.className = bad ? 'bad' : ''; }
  report(res) { if (res && !res.ok) this.say(res.error, true); else this.say(''); }
  async handle(action, data, el) {
    const fn = this.handlers[action]; if (!fn) return;
    try { await fn(data, el); } catch (e) { console.error(e); this.say('Beklenmeyen hata: ' + e.message, true); }
  }
  async submit() {
    const f = this.vs.form; if (!f) return;
    const v = id => this.val(id), err = m => { const e = document.getElementById('err'); if (e) e.textContent = m || ''; };
    const thinking = () => err('Yapay zekâ yönetmelik denetimi yapıyor…');
    let res;
    if (f.k === 'login') res = this.app.login(v('ln').trim(), v('lp'));
    else if (f.k === 'reg') res = this.app.register({ name: v('n'), surname: v('s'), birth: v('b'), address: v('a'), nick: v('nk'), pw: v('pw'), interests: [...document.querySelectorAll('[data-interest]:checked')].map(c => c.dataset.interest) });
    else if (f.k === 'topic') {
      thinking();
      res = await this.app.openTopic({ title: v('ti'), text: v('tx'), domain: v('dm'), scope: v('sc'), newDomain: v('nd'), newDomainParent: v('dp'), newScope: v('ns'), newScopeQuorum: v('nq'), parent: f.tid, confirmedDup: !!f.dupOk });
      if (res.needsConfirm) f.dupOk = true;
    } else { thinking(); res = await this.app.propose(f.k, f.tid, v('tx'), this.checked('an')); }
    if (!res.ok) { err(res.error); return; }
    this.say(res.degraded ? 'YZ denetimi ulaşılamadı; yalnızca yerel kurallar uygulandı.' : '');
    this.vs.form = null; this.render();
  }
  bind() {
    document.addEventListener('click', e => { const el = e.target.closest('[data-action]'); if (el) this.handle(el.dataset.action, el.dataset, el); });
    document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el) this.handle(el.dataset.change, el.dataset, el); });
    document.addEventListener('input', e => { const pid = e.target.dataset && e.target.dataset.range; if (!pid) return; document.getElementById('nv' + pid).textContent = e.target.value; document.getElementById('nc' + pid).textContent = e.target.value * e.target.value - 1; });
  }
}

/* ===== 10. COMPOSITION ROOT: tüm bağımlılıklar yalnızca burada bağlanır ===== */
const hasher = new Sha256Hasher(), clock = SystemClock;
const passwords = new PasswordHasher(hasher, CONFIG.PASSWORD_ROUNDS), ledger = new Ledger(hasher, clock);

function buildSeed() {
  const s = { v: CONFIG.SCHEMA_VERSION, me: null, domains: [{ n: 'yazılım', p: null }, { n: 'spor', p: null }, { n: 'futbol', p: 'spor' }, { n: 'basketbol', p: 'spor' }, { n: 'kampüs', p: null }], scopes: { ...CONFIG.DEFAULT_SCOPES }, users: [], topics: [], ledger: [] };
  [['u2', 'Ayşe', 'Kaya', 'ayse', ['futbol', 'kampüs']], ['u3', 'Can', 'Demir', 'can', ['basketbol', 'yazılım']], ['u4', 'Deniz', 'Arslan', 'deniz', ['kampüs']], [CONFIG.AI_USER_ID, 'Claude', 'Yapay zekâ', 'claude-ai', []], ['u6', 'Elif', 'Şahin', 'elif', ['yazılım', 'kampüs']]]
    .forEach(([id, name, surname, nick, interests]) => s.users.push(UserFactory.create({ id, name, surname, nick, interests, ai: id === CONFIG.AI_USER_ID, credential: id === CONFIG.AI_USER_ID ? null : passwords.make(Util.uid() + Util.uid()) })));
  s.users.find(u => u.id === 'u3').del.basketbol = CONFIG.AI_USER_ID;
  ledger.append(s.ledger, 'GENESIS', 'Defter başlatıldı');
  const open = (id, title, domain, scope, parent, text) => new TopicBuilder().id(id).title(title).domain(domain).scope(scope).parent(parent).text(text).status(ST.OPEN).supporters(['u2', 'u3']).build();
  s.topics.push(open('t1', 'Üniversiteye uçak indirme izni', 'kampüs', 'üni', null, 'Kampüste uçak indirilmesine şu an izin yoktur.'), open('t2', 'Pist yeri nerede olsun?', 'kampüs', 'üni', 't1', 'Henüz karar yok.'), open('t3', 'Haftalık spor tahminleri', 'spor', 'herkes', null, 'Tahminler her pazartesi paylaşılır.'), open('t4', 'Futbol tahminleri', 'futbol', 'herkes', 't3', 'Hafta sonu maçları burada tartışılır.'), open('t5', 'Basketbol tahminleri', 'basketbol', 'herkes', 't3', 'Hafta içi maçları burada tartışılır.'));
  s.topics.forEach(t => ledger.append(s.ledger, 'KONU', t.title + ' yayınlandı'));
  s.topics[3].cm.push({ by: 'u2', x: 'Bu hafta derbi var, tahmin açıyorum.', pub: true, t: clock.stamp() });
  s.topics[0].props.push(ProposalFactory.create('edit', { id: 'p1', by: 'u2', payload: 'Uçak yalnızca bahar şenliğinde ve kampüs dışındaki pistte inebilir.' }));
  return s;
}

const store = new Store(new StateRepository(pickStorage(), CONFIG.STORAGE_KEY, CONFIG.SCHEMA_VERSION, buildSeed));
const gateway = new AIGateway({ base: apiBase(navigator.userAgent), timeoutMs: CONFIG.AI.timeoutMs, retries: CONFIG.AI.retries, threshold: CONFIG.AI.breakerThreshold, cooldownMs: CONFIG.AI.breakerCooldownMs });
const delegation = new DelegationService();
const engine = new VotingEngine(delegation, new ScopeQuorum(), new SimpleMajority(), new SuperMajority());
const app = new App({
  store, ledger, clock, passwords, delegation, engine,
  credits: new CreditService(clock),
  resolution: new ResolutionService(engine, delegation, ledger, clock),
  regulation: new RegulationChain([new LocalRegulationRule(LOCAL_REGULATIONS), new RemoteRegulationRule(gateway)]),
  voter: new FallbackVoter(new RemoteAIVoter(gateway), new RuleBasedVoter()),
});
const viewState = { tab: 'k', form: null, showHidden: false };
const renderer = new Renderer(app, viewState);
const controller = new Controller(app, viewState, renderer);
store.subscribe(() => renderer.render());
controller.bind();
renderer.render();
</script></body></html>
